# USD asset gate: OpenUSD's validators plus this repo's house rules
# (.usd-asset-gate.yml) on stages the exporter writes from the committed fixture worlds.
# No USD is committed here, so the gate checks a sample generated in this job.
name: USD asset gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # usd-asset-gate has no release tag yet: a full commit SHA on its main branch
  # ("Bring two ARCHITECTURE.md passages up to date with the shipped MVP", 2026-10-18).
  USD_ASSET_GATE_SHA: e8b28531092a044ca6dbdf5b384e89f6ef03b516

jobs:
  generated-assets:
    name: generated stages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the exporter and usd-asset-gate (pinned)
        run: python -m pip install . "usd-asset-gate @ git+https://github.com/Preponderous-Software/usd-asset-gate@${USD_ASSET_GATE_SHA}"
      - name: Export the fixture worlds (text and binary, with the claims overlay)
        run: |
          out="$RUNNER_TEMP/usd-out"
          for version in 1.21.11 26.3; do
            mc-usd-export "tests/fixtures/world-$version" --bbox -16 -64 -16 15 319 15 \
              --claims examples/claims.json --out "$out/$version" --quiet
          done
          mc-usd-export tests/fixtures/world-26.3 --bbox -16 -64 -16 15 319 15 \
            --claims examples/claims.json --binary --out "$out/26.3-binary" --quiet
      - name: usd-asset-gate
        run: usd-asset-gate check --format github --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/usd-out"
