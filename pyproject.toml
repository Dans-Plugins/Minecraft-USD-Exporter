[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-usd-exporter"
version = "0.1.0"
description = "Export Minecraft Java Edition worlds to instanced, layered OpenUSD stages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel McCoy Stephenson" }]
requires-python = ">=3.12"
dependencies = [
    "usd-core==26.8",
    "anvil-parser2==0.10.6",
    "numpy>=2.5,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
lz4 = ["lz4==4.4.5"]
dev = ["pytest==9.1.1"]

[project.scripts]
mc-usd-export = "mcusd.cli:main"

[project.urls]
Homepage = "https://github.com/Dans-Plugins/Minecraft-USD-Exporter"
Issues = "https://github.com/Dans-Plugins/Minecraft-USD-Exporter/issues"

[tool.setuptools.packages.find]
include = ["mcusd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
